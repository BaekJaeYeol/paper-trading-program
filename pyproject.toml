[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "us-stock-autotrader"
version = "0.3.0"
description = "Daily US equity screening and Alpaca paper trading"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]
[project.scripts]
stockbot = "stockbot.cli:main"
[project.gui-scripts]
stockbot-gui = "stockbot.gui:main"
[tool.setuptools.packages.find]
where = ["src"]
