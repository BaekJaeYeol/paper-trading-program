name: Private state authentication smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate configuration
        env:
          APP_CLIENT_ID: ${{ vars.PRIVATE_STATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PRIVATE_STATE_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_CLIENT_ID" || { echo "::error::Missing PRIVATE_STATE_APP_CLIENT_ID variable"; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "::error::Missing PRIVATE_STATE_APP_PRIVATE_KEY secret"; exit 1; }
      - name: Create scoped installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PRIVATE_STATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_STATE_APP_PRIVATE_KEY }}
          owner: BaekJaeYeol
          repositories: paper-trading-private-state
          permission-contents: write
      - name: Checkout private state repository
        uses: actions/checkout@v4
        with:
          repository: BaekJaeYeol/paper-trading-private-state
          token: ${{ steps.app-token.outputs.token }}
          path: private-state
          persist-credentials: true
      - name: Write synthetic verification marker only
        working-directory: private-state
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p verification
          printf '{"synthetic":true,"run_id":"%s","purpose":"actions-auth-smoke-test"}\n' "$RUN_ID" > verification/actions-auth-smoke-test.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/actions-auth-smoke-test.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: verify private-state Actions authentication'
            git push origin HEAD:main
          fi
      - name: Verify committed marker
        working-directory: private-state
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:verification/actions-auth-smoke-test.json | grep -F "\"run_id\":\"$RUN_ID\"" >/dev/null
