name: Intraday 15-minute paper research
on:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/investment-intraday.yml'
permissions:
  contents: write
concurrency:
  group: hourly-paper-state
  cancel-in-progress: false
jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: paper-hourly-state
          path: saved-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exchange calendar
        run: python -m pip install exchange_calendars==4.12 pandas==2.2.3
      - name: Verify persistence and duplicate protection
        run: python -m unittest discover -s investment-lab/tests -p 'test_*day.py' -v
      - name: Verify calendar and realistic fills
        run: python -m unittest discover -s investment-lab/tests -p test_reliability.py -v
      - name: Collect and update virtual accounts
        run: python investment-lab/intraday.py --state saved-state/intraday-state
      - name: Persist accounts and status even on data errors
        if: always()
        working-directory: saved-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intraday-state
          if ! git diff --cached --quiet; then
            git commit -m 'chore: intraday paper data and account update'
            git push origin HEAD:paper-hourly-state
          fi
      - name: Publish run status
        if: always()
        run: |
          if [ -f saved-state/intraday-state/README.md ]; then
            cat saved-state/intraday-state/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
