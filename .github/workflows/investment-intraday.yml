name: Intraday 15-minute paper research
on:
  schedule:
    # Start/restart opportunities; a running session polls internally every 15 minutes.
    - cron: '7 11-21 * * 1-5'
  workflow_dispatch:
    inputs:
      emergency_stop:
        description: 'Stop v2 new trades; keep positions'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/investment-intraday.yml'
permissions:
  contents: write
concurrency:
  group: ${{ inputs.emergency_stop == true && 'intraday-control' || 'intraday-session' }}
  cancel-in-progress: false
jobs:
  cadence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q investment-lab
      - run: python -m unittest discover -s investment-lab/tests -p test_session_worker.py -v
      - run: python -m unittest discover -s investment-lab/tests -p test_market_continuity.py -v
  hourly:
    if: github.ref == 'refs/heads/main'
    needs: cadence-tests
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: paper-hourly-state
          path: saved-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persist emergency stop request
        if: ${{ inputs.emergency_stop == true }}
        run: |
          mkdir -p saved-state/intraday-state
          python -c "import json,datetime,pathlib; pathlib.Path('saved-state/intraday-state/emergency-stop.json').write_text(json.dumps({'halted':True,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}))"
      - name: Install exchange calendar
        run: python -m pip install exchange_calendars==4.12 pandas==2.2.3
      - name: Verify persistence and duplicate protection
        run: python -m unittest discover -s investment-lab/tests -p 'test_*day.py' -v
      - name: Verify calendar and realistic fills
        run: python -m unittest discover -s investment-lab/tests -p test_reliability.py -v
      - name: Verify comparisons and order recovery
        run: python -m unittest discover -s investment-lab/tests -p test_comparison_orders.py -v
      - name: Verify saved account integrity and operational recovery history
        run: python -m unittest discover -s investment-lab/tests -p test_operational_audit.py -v
      - name: Verify frozen bars and active account revision protection
        run: python -m unittest discover -s investment-lab/tests -p test_bar_reconciliation.py -v
      - name: Verify actual session coverage and delayed startup warnings
        run: python -m unittest discover -s investment-lab/tests -p test_session_coverage.py -v
      - name: Verify twenty additional evidence strategies
        run: python -m unittest discover -s investment-lab/tests -p test_extended_strategies.py -v
      - name: Verify trend strength, money flow and opening range
        run: python -m unittest discover -s investment-lab/tests -p test_more_strategies.py -v
      - name: Configure per-cycle account checkpoints
        run: |
          git -C saved-state config user.name 'github-actions[bot]'
          git -C saved-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f saved-state/intraday-state/emergency-stop.json ]; then
            python -c "import sys; from pathlib import Path; sys.path.insert(0, 'investment-lab'); from session_worker import publish; publish(Path('saved-state').resolve())"
          fi
      - name: Poll internally during scheduled sessions; single cycle for manual checks
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python -u investment-lab/session_worker.py --repo saved-state
          else
            python -u investment-lab/session_worker.py --repo saved-state --once
          fi
      - name: Install dashboard browser checks
        if: ${{ always() && !cancelled() && github.event_name != 'schedule' && hashFiles('saved-state/intraday-state/dashboard.html') != '' }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify dashboard freshness notice and desktop mobile interactions
        if: ${{ always() && !cancelled() && github.event_name != 'schedule' && hashFiles('saved-state/intraday-state/dashboard.html') != '' }}
        run: python investment-lab/check_dashboard_browser.py saved-state/intraday-state/dashboard.html
      - name: Upload dashboard verification
        if: ${{ always() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-verification
          path: |
            saved-state/intraday-state/dashboard.html
            saved-state/intraday-state/dashboard-*.png
      - name: Preserve pending account checkpoint even on errors
        if: always()
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'investment-lab'); from session_worker import publish; publish(Path('saved-state').resolve())"
      - name: Publish run status
        if: always()
        run: |
          if [ -f saved-state/intraday-state/README.md ]; then
            cat saved-state/intraday-state/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
