name: Hourly paper research
on:
  schedule:
    - cron: '17 * * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/investment-hourly.yml'
permissions:
  contents: write
concurrency:
  group: hourly-paper-state
  cancel-in-progress: false
jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: paper-hourly-state
          path: saved-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify persistence and duplicate protection
        run: python -m unittest discover -s investment-lab/tests -p test_hourly.py -v
      - name: Collect and update virtual accounts
        run: python investment-lab/hourly.py --state saved-state/hourly-state
      - name: Persist accounts and status even on data errors
        if: always()
        working-directory: saved-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hourly-state
          if ! git diff --cached --quiet; then
            git commit -m '기록: 일봉 모의투자 데이터·계좌 갱신'
            for attempt in 1 2 3; do
              git pull --rebase origin paper-hourly-state
              if git push origin HEAD:paper-hourly-state; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
            done
          fi
      - name: Publish run status
        if: always()
        run: |
          if [ -f saved-state/hourly-state/status.json ]; then
            cat saved-state/hourly-state/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
