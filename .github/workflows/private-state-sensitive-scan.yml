name: Paper state sensitive data scan (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: paper-hourly-state
          path: saved-state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan state without logging file contents
        run: python investment-lab/private_state_sensitive_scan.py --state saved-state
      - name: Explain scan limits
        if: always()
        run: echo "This heuristic scan is not a complete secret or privacy audit. Manual review is mandatory before transfer. Nonzero result blocks migration readiness." >> "$GITHUB_STEP_SUMMARY"
