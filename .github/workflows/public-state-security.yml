name: Public state security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-public-state:
    name: Prevent public state leaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tracked files
        run: python scripts/check_repository_files.py